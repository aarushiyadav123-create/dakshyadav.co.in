<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeraGaov - मेरी पहचान</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b3824;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 540px;
            padding: 22px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        /* प्रोफाइल और नाम का ऊपर वाला सेक्शन */
        .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
            background: #f1f8f5;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #c8e6c9;
        }
        .profile-pic {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2e7d32;
        }
        .profile-info h2 {
            font-size: 18px;
            color: #0b3824;
            text-align: left;
        }
        .profile-info p {
            font-size: 11px;
            color: #555;
            margin: 0;
            text-align: left;
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .desc-text {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .btn-group {
            margin-bottom: 15px;
        }
        .btn {
            background-color: #2e7d32;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: block;
            width: 100%;
        }
        .section-title {
            font-size: 15px;
            color: #0b3824;
            margin: 18px 0 8px 0;
            text-align: left;
            border-bottom: 2px solid #c8e6c9;
            padding-bottom: 4px;
            font-weight: bold;
        }
        
        /* फाइल लिस्ट स्टाइल */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .file-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .file-item:hover {
            background: #e2e8f0;
        }
        .file-icon {
            margin-right: 10px;
            font-size: 16px;
        }
        .file-name {
            word-break: break-all;
            flex-grow: 1;
        }

        /* फुल स्क्रीन पॉप-अप व्यूअर */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        #lightbox img, #lightbox video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }
        #lightbox span {
            position: absolute;
            top: 20px; right: 25px;
            color: white; font-size: 30px;
            cursor: pointer;
        }

        .footer {
            font-size: 11px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ========================================== -->
        <!-- ⚙️ आसान सेटिंग: यहाँ से आप नाम और फोटो बदल सकते हैं -->
        <!-- ========================================== -->
        <script>
            const myName = "MeraGaov - मेरी पहचान";
            const mySubTitle = "डिजिटल गाँव प्लेटफ़ॉर्म";
            const myProfilePic = "images/photo1.jpg"; // अपनी प्रोफाइल फोटो का नाम यहाँ बदल सकते हैं
        </script>

        <!-- ऊपर प्रोफाइल और नाम का कॉलम -->
        <div class="profile-section">
            <img src="" alt="Profile" class="profile-pic" id="profileImg" onerror="this.src='https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=100'">
            <div class="profile-info">
                <h2 id="profileTitle"></h2>
                <p id="profileSub"></p>
            </div>
        </div>

        <div class="badge">🚀 Closed Testing Live</div>
        
        <p class="desc-text">हमारा नया डिजिटल प्लेटफ़ॉर्म गूगल प्ले पर लाइव है। ऐप डाउनलोड करने और टेस्टर बनने के लिए नीचे क्लिक करें!</p>

        <div class="btn-group">
            <a href="https://play.google.com/store/apps/details?id=com.meragaov.haryana" class="btn" target="_blank">📱 Join Closed Testing (Play Store)</a>
        </div>

        <!-- फोटो लिस्ट सेक्शन -->
        <div class="section-title">📸 Photos</div>
        <div class="file-list" id="photoList"></div>

        <!-- वीडियो लिस्ट सेक्शन -->
        <div class="section-title">🎥 Videos</div>
        <div class="file-list" id="videoList"></div>

        <div class="footer">
            &copy; 2026 dakshyadav.co.in | All Rights Reserved
        </div>
    </div>

    <!-- फुल साइज़ देखने का बॉक्स -->
    <div id="lightbox">
        <span onclick="closeLightbox()">&times;</span>
        <div id="lightboxContent" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
    </div>

    <script>
        // प्रोफाइल डेटा सेट करना
        document.getElementById("profileTitle").innerText = myName;
        document.getElementById("profileSub").innerText = mySubTitle;
        document.getElementById("profileImg").src = myProfilePic;

        // 🖼️ अपनी गैलरी की फोटो और वीडियो के नाम यहाँ जोड़ें:
        const myPhotos = [
            "Screenshot_20260912_231949.jpg",
            "Screenshot_20260912_234617_Chrome.jpg"
        ];

        const myVideos = [
            "VID-20260911-WA0056 (1) (1).mp4"
        ];

        // फोटो लिस्ट दिखाने का कोड
        const photoContainer = document.getElementById("photoList");
        if(myPhotos.length > 0) {
            photoContainer.innerHTML = "";
            myPhotos.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span class="file-icon">🖼️</span><span class="file-name">${file}</span>`;
                item.onclick = () => openLightbox(`images/${file}`, 'image');
                photoContainer.appendChild(item);
            });
        } else {
            photoContainer.innerHTML = "<p style='font-size:12px; color:#777;'>No Photos</p>";
        }

        // वीडियो लिस्ट दिखाने का कोड
        const videoContainer = document.getElementById("videoList");
        if(myVideos.length > 0) {
            videoContainer.innerHTML = "";
            myVideos.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span class="file-icon">🎥</span><span class="file-name">${file}</span>`;
                item.onclick = () => openLightbox(`images/${file}`, 'video');
                videoContainer.appendChild(item);
            });
        } else {
            videoContainer.innerHTML = "<p style='font-size:12px; color:#777;'>No Videos</p>";
        }

        // फुल स्क्रीन खोलने का फंक्शन
        function openLightbox(src, type) {
            const content = document.getElementById('lightboxContent');
            if(type === 'image') {
                content.innerHTML = `<img src="${src}" alt="Full View">`;
            } else {
                content.innerHTML = `<video src="${src}" controls autoplay></video>`;
            }
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightboxContent').innerHTML = '';
        }
    </script>

</body>
</html>
